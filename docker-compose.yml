services:
  openwa:
    image: rmyndharis/openwa:latest
    restart: unless-stopped
    environment:
      ENGINE_TYPE: baileys
      # If OpenWA supports setting its API key via env, add that variable here
      # (see the OpenWA docs) and use the same value as OPENWA_API_KEY in .env.
    volumes:
      - openwa_data:/app/data
    ports:
      # Localhost only. Reach it from your laptop with an SSH tunnel if needed.
      - "127.0.0.1:2785:2785"

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      OPENWA_URL: http://openwa:2785
      # Plain interpolation so "docker compose up -d openwa" works before the key exists.
      # server.js refuses to start without it.
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      DASHBOARD_USER: ${DASHBOARD_USER:?Set DASHBOARD_USER in .env}
      DASHBOARD_PASS: ${DASHBOARD_PASS:?Set DASHBOARD_PASS in .env}
    expose:
      - "3000"
    depends_on:
      - openwa

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

volumes:
  openwa_data:
  caddy_data:
  caddy_config:
